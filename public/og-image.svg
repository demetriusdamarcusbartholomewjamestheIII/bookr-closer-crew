<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0EEE8"/>
      <stop offset="0.45" stop-color="#E8E6F8"/>
      <stop offset="1" stop-color="#EDE6D6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 120) rotate(90) scale(280)">
      <stop stop-color="#A4B0E8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A4B0E8" stop-opacity="0"/>
