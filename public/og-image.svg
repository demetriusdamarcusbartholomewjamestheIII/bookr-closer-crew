    <rect x="8" y="30.5" width="32" height="5" rx="2.5" fill="#2E3A8C"/>
  </g>
  <text x="600" y="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="#3B4A6B" letter-spacing="-2">Bookr</text>
  <text x="600" y="468" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="500" fill="#3B4A6B" fill-opacity="0.75">Every lead, answered in seconds</text>
